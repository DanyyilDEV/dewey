name: Build iOS (non firmato)
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx cap add ios
      - name: Permesso fotocamera
        run: /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Serve per scansionare il codice a barre dei libri'" ios/App/App/Info.plist
      - run: npx cap sync ios
      - name: Compila e crea l'IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr Dewey.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Dewey-ipa
          path: Dewey.ipa
