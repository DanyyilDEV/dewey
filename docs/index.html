<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dewey</title>

<style>
:root{--bg:#f3ead8;--paper:#fffaf0;--ink:#2b2118;--mute:#7b6c58;--line:#e0d2b6;--acc:#d2492f;--acc2:#1f3d4f;--ok:#2d7a4f;--warn:#9a5200;--warnbg:#ffecc8;--hue:#5b6b7a;--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;--mono:ui-monospace,"SF Mono",Menlo,"Courier New",monospace;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#171310;--paper:#221c16;--ink:#f4e9d4;--mute:#ab9b82;--line:#3b3126;--acc:#ee7b60;--acc2:#8fc0d8;--ok:#6cc28f;--warn:#f0b062;--warnbg:#3a2c16}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(var(--line) 1px,transparent 1.5px) 0 0/20px 20px,var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 20px}
h1{font:italic 700 2.7rem/1 var(--serif);margin:0;letter-spacing:-.03em}
h1::after{content:".";color:var(--acc)}
.stamp{font:600 .66rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--acc);border:1.5px solid var(--acc);padding:5px 8px;border-radius:6px;transform:rotate(4deg);text-align:center}
.card{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:3px 3px 0 var(--line)}
label{display:block;font:600 .7rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:5px;padding:12px;font:500 1rem system-ui,sans-serif;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px}
input:focus,select:focus{outline:none;border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translate(2px,2px)}
button:disabled{opacity:.55}
button.pri{background:var(--acc2);color:var(--paper);flex:1;box-shadow:3px 3px 0 var(--acc)}
button.big{width:100%;padding:20px;font-size:1.1rem;display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:14px;border-radius:14px}
#sc{background:var(--acc);color:#fff;box-shadow:4px 4px 0 var(--ink)}
#sc:active{box-shadow:1px 1px 0 var(--ink)}
#rd{border-radius:12px;overflow:hidden;margin-bottom:12px;border:1.5px solid var(--ink)}
#st{color:var(--mute);margin:8px 2px;min-height:1.4em}
h3{margin:0 0 2px;font:700 1.15rem/1.25 var(--serif)}
.m{margin:0 0 4px;color:var(--mute);font-size:.9rem}
.top{display:flex;gap:14px;margin-bottom:14px}
.tag{display:inline-block;font:600 .64rem var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;border:1px solid var(--ok);color:var(--ok);margin-bottom:6px}
.est .tag{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.cv{position:relative;flex:none;width:72px;height:108px;border-radius:3px 8px 8px 3px;background:var(--hue);display:grid;place-items:center;overflow:hidden;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--line)}
.cv span{font:italic 700 2.4rem var(--serif);color:rgba(255,255,255,.88)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--paper)}
.lab{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px 10px 0;margin-bottom:12px;background:var(--bg);overflow:hidden}
.lab i{align-self:stretch;width:12px;background:var(--hue);flex:none}
.lab b{font:700 1.9rem var(--mono);letter-spacing:-.03em}
.lab strong{display:block;line-height:1.2}.lab small{color:var(--mute)}
.est .lab{border-style:dashed}
.alt{font-size:.85rem;color:var(--mute);margin:-4px 0 12px}
.sv{width:100%}.sv.done{color:var(--ok);border-color:var(--ok);box-shadow:none}
.li{display:flex;gap:12px;align-items:center;padding:12px}
.li .cv{width:44px;height:64px;box-shadow:none}.li .cv span{font-size:1.4rem}
.li div{flex:1;min-width:0}.li b{display:block;font:700 1.1rem var(--mono)}.li strong{display:block;font:700 1rem var(--serif)}.li span{display:block;color:var(--mute);font-size:.85rem}
.x{padding:8px;color:var(--mute);border-width:1px;line-height:0}
.empty{text-align:center;color:var(--mute);padding:32px 8px;font:italic 1.05rem var(--serif)}
.pick{display:block;width:100%;text-align:left;margin-bottom:8px;font-weight:500;border-left:8px solid var(--hue)}
.pick b{font-family:var(--mono)}
details summary{cursor:pointer;color:var(--mute);margin:4px 2px 10px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;background:var(--paper);border-top:1.5px solid var(--ink);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;max-width:200px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font:600 .75rem system-ui,sans-serif;color:var(--mute)}
nav button.on{color:var(--acc)}
nav button.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--acc)}
nav svg{width:24px;height:24px}
</style>

<script>
const C=["Informatica, informazione e opere generali","Filosofia e psicologia","Religione","Scienze sociali","Lingue","Scienze pure","Tecnologia e scienze applicate","Arti e tempo libero","Letteratura","Storia e geografia"];
const D=("Informatica e opere generali|Bibliografia|Biblioteconomia e scienze dell'informazione|Enciclopedie generali|Non assegnato|Periodici generali|Associazioni e musei|Giornalismo ed editoria|Raccolte generali|Manoscritti e libri rari|"+
"Filosofia e psicologia|Metafisica|Epistemologia|Parapsicologia e occulto|Scuole filosofiche|Psicologia|Logica|Etica|Filosofia antica e orientale|Filosofia occidentale moderna|"+
"Religione|Filosofia della religione|Bibbia|Cristianesimo e teologia|Teologia morale e devozionale|Chiesa locale e ordini religiosi|Teologia sociale|Storia del cristianesimo|Confessioni cristiane|Altre religioni|"+
"Scienze sociali|Statistica|Scienze politiche|Economia|Diritto|Pubblica amministrazione e scienza militare|Problemi e servizi sociali|Educazione|Commercio e trasporti|Costumi e folclore|"+
"Lingue|Linguistica|Inglese|Tedesco|Francese|Italiano e rumeno|Spagnolo e portoghese|Latino|Greco classico|Altre lingue|"+
"Scienze pure|Matematica|Astronomia|Fisica|Chimica|Scienze della terra|Paleontologia|Biologia|Botanica|Zoologia|"+
"Tecnologia|Medicina e salute|Ingegneria|Agricoltura|Economia domestica|Gestione aziendale|Ingegneria chimica|Manifattura|Manifattura per usi specifici|Edilizia|"+
"Arti|Urbanistica e paesaggio|Architettura|Scultura|Disegno e arti decorative|Pittura|Grafica e stampe|Fotografia|Musica|Sport, giochi e spettacolo|"+
"Letteratura|Letteratura americana|Letteratura inglese|Letteratura tedesca|Letteratura francese|Letteratura italiana e rumena|Letteratura spagnola e portoghese|Letteratura latina|Letteratura greca classica|Altre letterature|"+
"Storia e geografia|Geografia e viaggi|Biografia e genealogia|Storia antica|Storia d'Europa|Storia d'Asia|Storia d'Africa|Storia del Nord America|Storia del Sud America|Altre aree").split("|");

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const info=v=>{const m=String(v??"").replace("/","").match(/^\W*(\d{3}(?:\.\d+)?)/);if(!m)return null;const d=+m[1].slice(0,3);return{n:m[1],c:C[d/100|0],d:D[d/10|0]}};
const pick=a=>{const l=(a||[]).map(info).filter(Boolean);if(!l.length)return null;const c={};l.forEach(x=>c[x.n]=(c[x.n]||0)+1);return l.sort((x,y)=>c[y.n]-c[x.n])[0]};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2);
const sim=(a,b)=>{const x=new Set(norm(a)),y=new Set(norm(b));if(!x.size||!y.size)return 0;let n=0;x.forEach(w=>y.has(w)&&n++);return n/Math.min(x.size,y.size)};
const num=v=>String(v).padStart(3,"0");
const HUE=["#5b6b7a","#7a5cc4","#b8862f","#2e78b7","#d4553f","#1f9a76","#c46b1d","#d1447f","#9b2f4a","#2a7f8f"];
const XI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const cover=(img,n)=>`<div class="cv"><span>${n[0]}</span>${img?`<img src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()" onload="if(this.naturalWidth<25)this.remove()">`:""}</div>`;
const lab=i=>`<div class="lab" style="--hue:${HUE[i.n[0]]}"><i></i><b>${i.n}</b><span><strong>${esc(i.d)}</strong><small>Classe ${i.n[0]}00 · ${esc(i.c)}</small></span></div>`;

/* ---- ISBN ---- */
function isbn13(s){
  s=s.replace(/[^\dXx]/g,"").toUpperCase();
  if(s.length===13&&/^97[89]/.test(s))return s;
  if(s.length===10){const b="978"+s.slice(0,9);let t=0;[...b].forEach((c,i)=>t+=c*(i%2?3:1));return b+(10-t%10)%10}
  return null;
}

/* ---- fonti (nessun login) ---- */
let LOG=[];
const PROXY="https://dewey-proxy.sarakula-daniele.workers.dev"; // per iPhone/web: indirizzo del proxy, es. "https://dewey-proxy.tuonome.workers.dev" (senza / finale)
const via=u=>PROXY+"/p?u="+encodeURIComponent(u);
const to=u=>{const c=new AbortController();setTimeout(()=>c.abort(),12000);return fetch(u,{signal:c.signal})};
async function F(u,json=true){
  let r;
  try{r=await to(u)}
  catch(e){try{r=await to(via(u));if(r.status===404)throw 0}catch(e2){throw new Error("bloccata, lenta o non raggiungibile")}}
  if(!r.ok)throw new Error("HTTP "+r.status);
  return json?r.json():r.text();
}
const J=u=>F(u);
async function T(name,fn,empty){
  try{const r=await fn();LOG.push(name+": "+(Array.isArray(r)?`${r.length} risultati, ${r.filter(x=>pick(x.ddc)).length} con Dewey`:r?"ok":"nessun dato"));return r}
  catch(e){LOG.push(name+": "+e.message);return empty}
}
const olIsbn=async isbn=>{
  const r=await J(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`),b=r["ISBN:"+isbn];
  return b?[{t:b.title,a:(b.authors||[]).map(x=>x.name).join(", "),y:b.publish_date,ddc:b.classifications?.dewey_decimal_class||[],s:(b.subjects||[]).map(x=>x.name).join(" "),img:b.cover?.medium||"",src:"Open Library"}]:[];
};
const olEd=async isbn=>{const b=await J(`https://openlibrary.org/isbn/${isbn}.json`);return[{t:b.title,a:"",y:b.publish_date,ddc:b.dewey_decimal_class||[],s:(b.subjects||[]).join(" "),src:"Open Library"}]};
const olSearch=async({isbn,title,author})=>{
  const p=new URLSearchParams({fields:"title,author_name,first_publish_year,ddc,subject,cover_i",limit:"10"});
  if(isbn)p.set("isbn",isbn);else{if(title)p.set("title",title);if(author)p.set("author",author)}
  const r=await J("https://openlibrary.org/search.json?"+p);
  return r.docs.map(d=>({t:d.title,a:(d.author_name||[]).slice(0,2).join(", "),y:d.first_publish_year,ddc:d.ddc||[],s:(d.subject||[]).slice(0,8).join(" "),img:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:"",src:"Open Library"}));
};
const SBN="https://opac.sbn.it/opacmobilegw/";
function deweyFrom(o){
  const out=[];
  (function w(x,f){if(x&&typeof x==="object"){const g=f||(!Array.isArray(x)&&Object.values(x).some(v=>typeof v==="string"&&/dewey|\bcdd\b/i.test(v)));for(const [k,v] of Object.entries(x))w(v,g||/dewey/i.test(k))}else if(f){const i=info(x);if(i)out.push(i.n)}})(o,false);
  if(!out.length){const m=JSON.stringify(o).match(/dewey[^0-9]{0,60}(\d{3}(?:\.\d+)?)/i);if(m)out.push(m[1])}
  return out;
}
const i10=i=>{const b=i.slice(3,12);let t=0;[...b].forEach((c,k)=>t+=c*(10-k));const r=(11-t%11)%11;return b+(r===10?"X":r)};
const sbn=async({isbn,q,verify})=>{
  const out=[],v=verify||isbn;let seen=0;
  const s=await J(SBN+"search.json?"+(isbn?"isbn="+isbn:"any="+encodeURIComponent(q))+"&rows=5");
  for(const r of (s.briefRecords||[]).slice(0,v?5:3)){
    const bid=r.codiceIdentificativo||r.bid;if(!bid)continue;
    const f=await J(SBN+"full.json?bid="+encodeURIComponent(bid));seen++;
    if(v){const z=JSON.stringify(f).replace(/[-\s]/g,"");if(!z.includes(v)&&!z.includes(i10(v)))continue}
    const d=deweyFrom(f);
    if(!d.length)LOG.push("SBN campi del record: "+Object.keys(f).slice(0,30).join(", "));
    out.push({t:f.titolo||r.titolo||"",a:f.autorePrincipale||r.autorePrincipale||"",y:"",ddc:d,s:"",src:"SBN (catalogo italiano)"});
  }
  if(v&&!out.length)LOG.push(`SBN: ${seen} record scartati perché non contengono questo ISBN`);
  return out;
};
const sbnUni=async isbn=>{
  const x=await F(`https://opac.sbn.it/sbn3.0/opaclib?db=solr_iccu&select_db=solr_iccu&do_cmd=search_show_cmd&format=unimarc&rpnlabel=+ISBN+%3D+${isbn}+%28parole+in+AND%29+&rpnquery=%40attrset+bib-1++%40attr+1%3D7+%40attr+4%3D6+%22${isbn}%22&totalResult=1&fname=none`,false);
  const m=x.match(/676[\s\S]{0,300}?(?:code="a"[^>]*>|\$a|\^a)\s*(\d{3}(?:\.\d+)?)/)||x.match(/dewey[^0-9]{0,60}(\d{3}(?:\.\d+)?)/i);
  return m?[{t:"",a:"",y:"",ddc:[m[1]],s:"",src:"SBN (catalogo italiano)"}]:[];
};
const loc=async isbn=>{
  const x=await F(`http://lx2.loc.gov:210/LCDB?version=1.1&operation=searchRetrieve&query=bath.isbn%3D${isbn}&maximumRecords=1&recordSchema=mods`,false);
  const m=[...x.matchAll(/<classification[^>]*authority="ddc"[^>]*>([^<]+)</g)].map(v=>v[1]);
  return m.length?[{t:"",a:"",y:"",ddc:m,s:"",src:"Library of Congress"}]:[];
};
const gb=async q=>{
  const r=await J("https://www.googleapis.com/books/v1/volumes?maxResults=3&q="+encodeURIComponent(q)),v=r.items?.[0]?.volumeInfo;
  return v?{t:v.title,a:(v.authors||[]).join(", "),cats:(v.categories||[]).join(" "),desc:(v.description||"").slice(0,300),lang:v.language,img:(v.imageLinks?.thumbnail||v.imageLinks?.smallThumbnail||"").replace("http://","https://")}:null;
};

/* ---- stima dall'argomento (solo se nessun catalogo ha il Dewey) ---- */
const K=[[/aristotel/,"185"],[/platon|plato/,"184"],[/kant|hegel|nietzsche|schopenhauer|heidegger/,"193"],[/metafisic/,"110"],[/logic/,"160"],[/etic[ao]|ethic|moral/,"170"],[/psicolog|psycholog|psicoanali/,"150"],[/filosof|philosoph/,"100"],
[/bibbia|bible|vangel|gospel/,"220"],[/cristian|chiesa|church|christian|teolog|theolog/,"230"],[/religion|religione|islam|buddh|induis|hindu/,"200"],
[/democra|politic|stato\b|state\b/,"320"],[/econom/,"330"],[/diritto|law\b|legal|giuridic/,"340"],[/educazion|pedagog|didatt|education/,"370"],[/sociolog|social/,"300"],[/antropolog|folclor|folklore|costum/,"390"],[/statistic/,"310"],
[/programm|software|python|javascript|coding/,"005"],[/comput|informatic|internet|\bweb\b/,"004"],
[/grammatic|linguistic|lingua|language|dizionari|dictionar/,"400"],
[/matematic|math|algebra|geometr/,"510"],[/astronom|cosmo|universo/,"520"],[/fisic|physics|quantist|quantum/,"530"],[/chimic|chemis/,"540"],[/geolog|clima|meteo|earth science/,"550"],[/biolog|evoluz|evolution|genetic|dna/,"570"],[/botanic|piante|plants|giardin/,"580"],[/zoolog|animali|animals|uccelli|birds/,"590"],
[/cucina|cooking|ricett|recipe|food/,"641"],[/medic|salute|health|disease|malatt|cancer|dieta|nutri/,"610"],[/ingegner|engineer/,"620"],[/agricol|farming|coltiv/,"630"],[/gestione|management|business|marketing|impresa|leadership/,"650"],
[/architettur/,"720"],[/scultur/,"730"],[/fotograf|photograph/,"770"],[/pittur|painting/,"750"],[/design|moda\b|fashion|disegno/,"740"],[/music/,"780"],[/cinema|film|sport|calcio|scacchi|chess|giochi|games/,"790"],[/\barte\b|\bart\b/,"700"],
[/biograf|memoir|autobiograf|diario/,"920"],[/geograf|viaggi|travel|guida\b|guide\b/,"910"],[/storia antica|ancient history|roma antica|egitt|grecia antica/,"930"],[/medioev|rinascimento|guerra|\bwar\b|europ/,"940"],[/storia|history/,"900"],
[/poesi|poetry|poem/,"L1"],[/romanz|novel|fiction|narrativ|racconti|thriller|giallo|fantasy|fantascienza/,"L3"],[/dramma|theatre|theater|teatro/,"L2"],[/saggi|essays/,"L4"]];
const LIT={it:"85",en:"82",fr:"84",de:"83",es:"86"};
function estimate(text,lang){
  text=text.toLowerCase();const sc={};
  for(const [re,d] of K)if(re.test(text))sc[d]=(sc[d]||0)+1;
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];if(!best)return null;
  let d=best[0];if(d[0]==="L")d=(LIT[lang]||"89")+d[1];
  return d;
}

/* ---- ricerca ---- */
async function lookup({isbn,title,author}){
  LOG=[];const say=t=>$("#st").textContent=t;say("Cerco nei cataloghi…");
  const q=[title,author].filter(Boolean).join(" ");
  const jobs=isbn?[T("Open Library (ISBN)",()=>olIsbn(isbn),[]),T("Open Library (edizione)",()=>olEd(isbn),[]),T("Open Library (ricerca)",()=>olSearch({isbn}),[]),T("SBN",()=>sbn({isbn}),[]),T("SBN (ricerca libera)",()=>sbn({q:isbn,verify:isbn}),[]),T("SBN (UNIMARC)",()=>sbnUni(isbn),[]),T("Library of Congress",()=>loc(isbn),[])]
    :[T("Open Library",()=>olSearch({title,author}),[]),T("SBN",()=>sbn({q}),[])];
  const gbp=T("Google Books",()=>gb(isbn?"isbn:"+isbn:`intitle:${title}`+(author?`+inauthor:${author}`:"")),null);
  const res=await Promise.all(jobs),meta=await gbp;
  let all=res.flat().map(x=>({...x,exact:!!isbn}));
  const ref=(isbn?meta?.t||title:title)||meta?.t||"";
  const cov=x=>x.img||meta?.img||(isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`:"");
  if(!all.some(x=>pick(x.ddc))&&isbn&&meta?.t){
    say("Provo con titolo e autore…");
    const [a2,b2]=await Promise.all([T("SBN (per titolo)",()=>sbn({q:meta.t+" "+meta.a}),[]),T("Open Library (per titolo)",()=>olSearch({title:meta.t,author:meta.a}),[])]);
    all=[...all,...[...b2,...a2].map(x=>({...x,exact:false}))];
  }
  const seen=new Set();
  let c=all.map(x=>({...x,t:x.t||meta?.t||title||"(senza titolo)",a:x.a||meta?.a||author||"",img:cov(x),i:pick(x.ddc)}))
    .filter(x=>x.i&&(x.exact||sim(x.t,ref)>=0.6))
    .filter(x=>{const k=x.t+x.i.n;if(seen.has(k))return false;seen.add(k);return true})
    .sort((x,y)=>y.exact-x.exact).slice(0,5);
  const dropped=all.filter(x=>pick(x.ddc)).length-c.length;
  if(dropped>0)LOG.push(`Scartati ${dropped} risultati con Dewey ma titolo diverso da "${ref}"`);
  if(!c.length){
    const e=estimate([title,author,meta?.t,meta?.a,meta?.cats,meta?.desc,...all.map(x=>x.s)].join(" "),meta?.lang);
    if(e)c=[{t:meta?.t||title||"(senza titolo)",a:meta?.a||author||"",ddc:[e],i:info(e),img:cov({}),est:true,src:"Stima dall'argomento"}];
  }
  return {c,meta};
}
const diag=()=>`<details><summary>Dettagli della ricerca</summary><div class="card m">${LOG.map(esc).join("<br>")}</div></details>`;

let R=[];
function show(c){
  const manual=`<details ${c.length?"":"open"}><summary>${c.length?"Non è quello giusto? Scegli a mano":"Scegli la categoria a mano"}</summary><div class="card"><label>Categoria<select id="man">${D.map((n,i)=>`<option value="${num(i*10)}">${num(i*10)} – ${esc(n)}</option>`).join("")}</select></label><button class="sv pri" data-m="1">Salva in libreria</button></div></details>`;
  R=c;
  $("#res").innerHTML=c.map((o,k)=>{
    const alt=o.ddc.map(info).filter(Boolean).map(x=>x.n).filter(n=>n!==o.i.n);
    const dup=lib.some(r=>r.t===o.t&&r.n===o.i.n);
    return `<article class="card ${o.est?"est":""}"><div class="top">${cover(o.img,o.i.n)}<div><span class="tag">${o.est?"Stima da verificare":"Fonte: "+esc(o.src)+(o.exact?"":" · altra edizione")}</span><h3>${esc(o.t)}</h3><p class="m">${esc([o.a,o.y].filter(Boolean).join(", "))}</p></div></div>${lab(o.i)}
    ${alt.length?`<p class="alt">Altre edizioni: ${alt.slice(0,4).join(", ")}</p>`:""}
    <button class="sv ${dup?"done":""}" data-k="${k}">${dup?"Già in libreria":"Salva in libreria"}</button></article>`}).join("")+manual+diag();
  if(!c.length)$("#st").textContent="Nessun numero Dewey trovato.";
}
let SEQ=0,AUTO=false;
async function run(args){
  const my=++SEQ;$("#res").innerHTML="";$("#go").disabled=true;
  try{const {c,meta}=await lookup(args);if(my!==SEQ)return;
    if(c.length)$("#st").textContent="";
    if(meta){if(!$("#ti").value){$("#ti").value=meta.t||"";AUTO=true}if(!$("#au").value){$("#au").value=meta.a||"";AUTO=true}}
    show(c);
  }catch(e){if(my===SEQ)$("#st").textContent="Errore di rete. Controlla la connessione e riprova."}
  finally{if(my===SEQ)$("#go").disabled=false}
}
$("#go").onclick=()=>{
  const raw=$("#is").value.trim(),isbn=raw?isbn13(raw):null,title=$("#ti").value.trim(),author=$("#au").value.trim();
  if(raw&&!isbn)return $("#st").textContent="ISBN non valido: servono 10 o 13 cifre.";
  if(!isbn&&!title)return $("#st").textContent="Inserisci un ISBN oppure almeno il titolo.";
  run({isbn,title,author});
};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("#is,#ti,#au"))$("#go").click();if(e.key==="Enter"&&e.target.id==="dq")$("#dg").click()});

/* ---- scanner dal vivo ---- */
let H=null;
async function stopScan(){if(H){try{await H.stop()}catch(e){}H=null}$("#rd").hidden=$("#cn").hidden=true}
$("#sc").onclick=async()=>{
  if(H)return;$("#res").innerHTML="";$("#st").textContent="";
  $("#rd").hidden=$("#cn").hidden=false;
  try{
    H=new Html5Qrcode("rd",{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13],verbose:false});
    await H.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:130}},async t=>{
      const i=isbn13(t);if(!i)return;
      navigator.vibrate&&navigator.vibrate(60);await stopScan();AUTO=false;$("#is").value=i;$("#ti").value=$("#au").value="";run({isbn:i});
    },()=>{});
    $("#st").textContent="Inquadra il codice a barre sul retro del libro.";
  }catch(e){await stopScan();$("#st").textContent=typeof Html5Qrcode==="undefined"?"Lo scanner richiede internet: controlla la connessione.":"Fotocamera non disponibile. Concedi il permesso oppure inserisci l'ISBN a mano."}
};
$("#cn").onclick=()=>{stopScan();$("#st").textContent=""};

/* ---- libreria ---- */
let lib=[];try{lib=JSON.parse(localStorage.dewey||"[]")}catch(e){}
const persist=()=>{try{localStorage.dewey=JSON.stringify(lib)}catch(e){}$("#cnt").textContent=lib.length?"("+lib.length+")":"";renderLib()};
$("#res").onclick=e=>{
  const b=e.target.closest(".sv");if(!b||b.classList.contains("done"))return;
  let rec;
  if(b.dataset.m){const n=$("#man").value,i=info(n);rec={t:$("#ti").value.trim()||"Senza titolo",a:$("#au").value.trim(),n,c:i.c,d:i.d}}
  else{const o=R[+b.dataset.k];rec={t:o.t,a:o.a,n:o.i.n,c:o.i.c,d:o.i.d,img:o.img||""}}
  if(lib.some(r=>r.t===rec.t&&r.n===rec.n)){b.textContent="Già in libreria";b.classList.add("done");return}
  lib.unshift(rec);persist();b.textContent="Salvato";b.classList.add("done");
};
function renderLib(){
  const s=lib.map((r,i)=>({...r,i})).sort((a,b)=>parseFloat(a.n)-parseFloat(b.n));
  $("#lib").innerHTML=s.length?s.map(r=>`<div class="card li" style="--hue:${HUE[r.n[0]]}">${cover(r.img,r.n)}<div><b>${r.n}</b><strong>${esc(r.t)}</strong><span>${esc(r.a)}</span><span>${esc(r.d)}</span></div><button class="x" data-r="${r.i}" aria-label="Elimina ${esc(r.t)}">${XI}</button></div>`).join(""):`<div class="empty">La tua libreria è vuota.<br>Scansiona il primo libro!</div>`;
}
$("#lib").onclick=e=>{const b=e.target.closest("[data-r]");if(b&&confirm("Eliminare questo libro?")){lib.splice(+b.dataset.r,1);persist()}};
$("#ex").onclick=async()=>{
  if(!lib.length)return;const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv="\ufeffDewey,Categoria,Classe,Titolo,Autore\n"+lib.map(r=>[r.n,r.d,r.c,r.t,r.a].map(q).join(",")).join("\n");
  const f=new File([csv],"libreria-dewey.csv",{type:"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(_){}}
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();
};

/* ---- cerca per codice Dewey o parola ---- */
const dline=(n,t,sub)=>`<button class="pick card" style="--hue:${HUE[n[0]]}" data-q="${n}"><b>${n}</b> &nbsp;${esc(t)}${sub?`<br><small style="color:var(--mute)">${esc(sub)}</small>`:""}</button>`;
function dewey(){
  const q=$("#dq").value.trim().toLowerCase(),out=$("#dr");if(!q){out.innerHTML="";return}
  if(/^\d/.test(q)){
    const d=q.replace(/\D/g,"");
    if(d.length===1){out.innerHTML=`<div class="card"><h3>Classe ${d}00</h3><p class="m">${esc(C[d])}</p></div>`+D.slice(d*10,d*10+10).map((t,i)=>dline(num(d*100+i*10),t)).join("");return}
    const n=d.length===2?d+"0":d.slice(0,3)+(d.length>3?"."+d.slice(3):""),i=info(n);
    out.innerHTML=`<div class="card">${lab(i)}
    <p class="m" style="margin:0">Il nome mostrato è quello della divisione (${num(+i.n.slice(0,2)*10)}). Le cifre successive precisano l'argomento.</p></div>`+
    `<p class="m">Altre divisioni della classe ${i.n[0]}00</p>`+D.slice(i.n[0]*10,i.n[0]*10+10).map((t,k)=>dline(num(i.n[0]*100+k*10),t)).join("");
    return;
  }
  const hit=[];C.forEach((t,i)=>{if(t.toLowerCase().includes(q))hit.push(dline(num(i*100),t,"Classe principale"))});
  D.forEach((t,i)=>{if(i%10&&t.toLowerCase().includes(q))hit.push(dline(num(i*10),t,"Classe "+(i/10|0)+"00 – "+C[i/10|0]))});
  out.innerHTML=hit.length?hit.join(""):`<div class="empty">Nessuna categoria contiene “${esc(q)}”.</div>`;
}
$("#dg").onclick=dewey;
$("#dr").onclick=e=>{const b=e.target.closest("[data-q]");if(b){$("#dq").value=b.dataset.q;dewey()}};

/* ---- schede ---- */
const tab=n=>{[1,2,3].forEach(i=>{$("#s"+i).hidden=i!==n;$("#t"+i).classList.toggle("on",i===n)});if(n!==1)stopScan()};
[1,2,3].forEach(i=>$("#t"+i).onclick=()=>tab(i));
$("#is").addEventListener("input",()=>{if(AUTO){$("#ti").value=$("#au").value="";AUTO=false}});
["#ti","#au"].forEach(x=>$(x).addEventListener("input",()=>AUTO=false));
$("#rs").onclick=()=>{["#is","#ti","#au"].forEach(x=>$(x).value="");$("#res").innerHTML="";$("#st").textContent="";AUTO=false;SEQ++;$("#go").disabled=false};
(()=>{const c=document.createElement("canvas");c.width=c.height=180;const g=c.getContext("2d");g.fillStyle="#d2492f";g.fillRect(0,0,180,180);g.fillStyle="#fffaf0";g.font="italic 700 120px Georgia,serif";g.textAlign="center";g.fillText("D",90,128);g.fillRect(48,146,84,8);const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL();document.head.append(l)})();
persist();
</script>
